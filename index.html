<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Nourish：一座以气味索引书籍、影视与其他作品的私人收藏馆。">
    <title>Nourish · 私人收藏馆</title>
    <link rel="stylesheet" href="assets/styles.css">
    <script src="assets/app.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <img class="monogram" src="resources/Nourish_mx-mark.svg" alt="" aria-hidden="true">
      <div class="header-content">
        <div class="top-row">
          <div>
            <p class="kicker">NOURISH / PERSONAL LIBRARY</p>
            <h1>Nourish</h1>
          </div>
          <label class="search-label">
            <span class="sr-only">搜索作品</span>
            <input class="search" id="search" autocomplete="off" placeholder="搜索中文或英文标题">
          </label>
        </div>
        <nav class="categories" id="categories" aria-label="作品分类"></nav>
        <div class="header-actions">
          <button class="fairy" id="guide-open" type="button">
            <span>气味索引</span>
            <img src="resources/Nourish_fairy.svg" alt="">
          </button>
          <button class="clear-scent" id="clear-scent" type="button" hidden></button>
        </div>
      </div>
    </header>

    <main>
      <form class="add-form" id="add">
        <input id="new-title" name="new-title" required autocomplete="off" placeholder="我还想看...">
        <input id="new-en" name="new-en" autocomplete="off" placeholder="English Name">
        <select id="new-kind" name="new-kind" aria-label="分类">
          <option value="" selected disabled>分类</option>
          <option value="书籍">书籍</option>
          <option value="影视">影视</option>
          <option value="其他">其他</option>
        </select>
        <input id="new-tags" name="new-tags" autocomplete="off" placeholder="它闻起来像...">
        <button type="submit">添加</button>
      </form>

      <div class="support">
        <span id="count" aria-live="polite"></span>
        <label class="sort-control">排序
          <select id="sort-by" aria-label="排序">
            <option value="added-desc">最近添加</option>
            <option value="title-asc">名称 ASC</option>
            <option value="title-desc">名称 DESC</option>
            <option value="year-asc">作品年份 ASC</option>
            <option value="year-desc">作品年份 DESC</option>
          </select>
        </label>
      </div>

      <section class="grid" id="grid" aria-live="polite"></section>
      <div class="pager-shell">
        <nav class="pager" id="pager" aria-label="分页"></nav>
        <nav class="page-size" id="page-size" aria-label="显示页数"></nav>
      </div>
    </main>

    <dialog id="guide" aria-labelledby="guide-title">
      <button class="guide-close" id="guide-close" type="button" aria-label="关闭气味索引">×</button>
      <p class="guide-kicker">NOURISH / SCENT ATLAS</p>
      <h2 id="guide-title">气味索引</h2>
      <p class="guide-intro">用调香的逻辑读取书影：先以六种底色定位，再用具体的花、果、木与景物捕捉它的余韵。</p>
      <div id="guide-content" class="guide-content"></div>
    </dialog>

    <noscript>请开启 JavaScript 后使用 Nourish。</noscript>
  </body>
</html>
